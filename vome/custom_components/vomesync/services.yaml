create_switch:
  name: Create Switch
  description: Create a new VomeSync switch
  fields:
    name:
      name: Switch Name
      description: Name for the switch entity
      required: true
      selector:
        text:
    description:
      name: Description
      description: Optional description for the switch
      required: false
      selector:
        text:
    location:
      name: Location
      description: Optional location (city-level for privacy)
      required: false
      selector:
        text:
    category:
      name: Category
      description: Switch category
      required: false
      default: "Other"
      selector:
        select:
          mode: dropdown
          options:
            - "Community"
            - "Personal"
            - "Event"
            - "Test"
            - "Other"
    publicize:
      name: Publicize
      description: List switch publicly on sync.vome.io
      required: false
      default: false
      selector:
        boolean:
    link:
      name: Link (optional)
      description: Optional external link shown on the switch page
      required: false
      selector:
        text:
    icon_url:
      name: Icon URL (optional)
      description: Optional icon image URL for the switch page
      required: false
      selector:
        text:
    banner_url:
      name: Banner URL (optional)
      description: Optional banner image URL for the switch page
      required: false
      selector:
        text:
    captcha_token:
      name: CAPTCHA token (optional)
      description: If the server requires CAPTCHA for public switches, provide a token (or bypass token if configured)
      required: false
      selector:
        text:
          type: text

subscribe_switch:
  name: Subscribe to Switch
  description: Subscribe to an existing VomeSync switch
  fields:
    uid:
      name: Switch UID
      description: UID of the switch to subscribe to
      required: true
      selector:
        text:

delete_switch:
  name: Delete Switch
  description: Delete a VomeSync switch (owner only — removes it for everyone subscribed)
  fields:
    uid:
      name: Switch UID
      description: UID of the switch to delete
      required: true
      selector:
        text:

forget_switch:
  name: Forget switch
  description: Remove a switch from this Home Assistant only. Never contacts the server, so it never affects the switch for anyone else (or the switch itself if you're the owner) — the normal, safe way to stop tracking a switch you subscribed to.
  fields:
    uid:
      name: Switch UID
      description: UID of the switch to forget
      required: true
      selector:
        text:

list_switches:
  name: List switches
  description: Return this entry's known switches (owned + subscribed), used by the Vome add-on panel
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:

get_remote_status:
  name: Get remote access status
  description: Return link / full-UI / LAN tunnel status (used by the Vome add-on panel)
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:

set_forward_ui:
  name: Set full-UI forwarding
  description: Enable or disable Home Assistant full-UI forwarding on the friendly domain
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    forward_ui:
      name: Allow full-UI forwarding
      required: true
      selector:
        boolean:

set_lan_routes:
  name: Replace LAN routes
  description: Replace the full list of LAN path tunnels
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    routes:
      name: Routes
      required: true
      selector:
        object:

set_relay_server:
  name: Set relay server URL
  description: >-
    Point an existing link at a different relay WebSocket URL (dev/staging).
    Leave blank to reset to the default relay. Scriptable counterpart to the
    options-flow relay-server step.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    ws_url:
      name: Relay WebSocket URL
      description: e.g. ws://host:3002/ws/relay — blank resets to default
      required: false
      default: ""
      selector:
        text:

set_webhooks:
  name: Set published webhooks
  description: >-
    Replace the list of Home Assistant webhook ids that can be called from the
    internet through your Vome address. Published webhooks need no login — the
    webhook id is the only credential — so list only the ones you mean to
    expose. Full-UI forwarding is not required.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    webhooks:
      name: Webhook ids
      description: The complete list; anything not listed stops being reachable
      required: true
      selector:
        object:

add_webhook:
  name: Publish a webhook
  description: >-
    Make one Home Assistant webhook callable from the internet through your
    Vome address. Copy the id from the automation's webhook trigger.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    webhook_id:
      name: Webhook id
      required: true
      selector:
        text:

remove_webhook:
  name: Unpublish a webhook
  description: Stop a webhook being reachable from the internet
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    webhook_id:
      name: Webhook id
      required: true
      selector:
        text:

set_local_url:
  name: Set local Home Assistant address
  description: >-
    Override the address the relay uses to reach this Home Assistant. Normally
    detected automatically from the port Home Assistant is listening on — set
    this only when detection gets it wrong (a reverse proxy in front of Core, a
    certificate that matches only one name). Leave blank to go back to
    automatic detection.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    local_url:
      name: Local address
      description: e.g. http://127.0.0.1:8123 — blank returns to automatic detection
      required: false
      default: ""
      selector:
        text:

set_external_url:
  name: Set external Home Assistant address
  description: >-
    Tell Home Assistant the public address it is reached on (Settings > System >
    Network > External URL). Apps and notifications use it to find this instance
    from outside; left unset, the companion app can fail to reconnect without
    saying why. Leave blank to use the Vome address already serving this
    instance.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    external_url:
      name: External address
      description: e.g. https://myhome.home.vome.io — blank uses your Vome address
      required: false
      default: ""
      selector:
        text:

add_lan_route:
  name: Add LAN route
  description: Add one /t/<slug>/ tunnel to a LAN host
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    slug:
      name: Slug
      required: true
      selector:
        text:
    name:
      name: Display name
      required: false
      selector:
        text:
    host:
      name: LAN host
      required: true
      selector:
        text:
    port:
      name: Port
      required: true
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    scheme:
      name: Scheme
      required: false
      default: http
      selector:
        select:
          options:
            - http
            - https
            - tcp
    enabled:
      name: Enabled
      required: false
      default: true
      selector:
        boolean:
    websocket:
      name: Allow WebSocket
      required: false
      default: true
      selector:
        boolean:

remove_lan_route:
  name: Remove LAN route
  description: Remove a LAN path tunnel by slug
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    slug:
      name: Slug
      required: true
      selector:
        text:

mint_lan_tcp_token:
  name: Get LAN tunnel token
  description: >-
    Mint a short-lived bearer token for a tcp-scheme LAN route, to use with
    `npx @vortitron/home-assistant-mcp tunnel --token <token>` (e.g. for RDP).
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    slug:
      name: Slug
      required: true
      selector:
        text:
    ttl_seconds:
      name: Token lifetime (seconds)
      required: false
      default: 3600
      selector:
        number:
          min: 60
          max: 86400
          mode: box

link_start:
  name: Connect to Vome (start)
  description: >
    Begin linking this Home Assistant to a Vome account. Returns a short code
    and the URL to approve it at. Used by the add-on panel's Connect flow.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    portal_url:
      name: Vome site URL
      description: >-
        Portal to approve the link at. Production is https://vome.io; staging
        is https://staging.vome.io. Blank uses production.
      required: false
      selector:
        text:
    device_code:
      name: Prefetched device code
      description: >
        Optional. The add-on panel fetches the code from the configured Vome
        site and passes it here so Home Assistant does not request a second
        code from a different origin.
      required: false
      selector:
        text:
    user_code:
      name: Prefetched user code
      required: false
      selector:
        text:
    verification_uri:
      name: Prefetched approval URL
      required: false
      selector:
        text:

link_poll:
  name: Connect to Vome (check approval)
  description: >
    Check whether the code from link_start has been approved yet. Once approved,
    stores the relay credentials and starts the outbound relay.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:

unlink:
  name: Disconnect from Vome
  description: >
    Remove the Vome link from this Home Assistant and stop the outbound relay.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
