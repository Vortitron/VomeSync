<!DOCTYPE html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vome</title>
	<link rel="stylesheet" href="static/styles.css?v=0.3.26">
	<style>
		/* Old cached app.js marks Remote Desktop as .primary. It is not the next step. */
		#qa-rdp, #qa-rdp.primary {
			background: #14161c !important;
			color: #eceff4 !important;
			border-color: #262b36 !important;
		}
	</style>
</head>
<body>
	<!-- Icons are inline SVG: the panel is served from the add-on with no
	     internet dependency, so no icon font/CDN. -->
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<defs>
			<g id="i-grid"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>
			<g id="i-monitor"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></g>
			<g id="i-tunnel"><path d="M4 20v-6a8 8 0 0 1 16 0v6"/><path d="M9 20v-5a3 3 0 0 1 6 0v5"/></g>
			<g id="i-link"><path d="M10 14a4 4 0 0 0 6 .4l3-3a4 4 0 1 0-5.7-5.6l-1.2 1.2"/><path d="M14 10a4 4 0 0 0-6-.4l-3 3a4 4 0 1 0 5.7 5.6l1.2-1.2"/></g>
			<g id="i-info"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></g>
			<g id="i-refresh"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></g>
			<g id="i-switch"><rect x="2" y="8" width="20" height="8" rx="4"/><circle cx="16" cy="12" r="3"/></g>
		</defs>
	</svg>

	<aside class="tree" aria-label="Vome navigation">
		<div class="brand">Vome<span class="brand-sub">control panel</span></div>
		<nav>
			<button type="button" class="tree-item active" data-view="overview">
				<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grid"/></svg>Overview
			</button>
			<details open>
				<summary>Remote access</summary>
				<button type="button" class="tree-item" data-view="forward">
					<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-monitor"/></svg>Home Assistant UI
				</button>
				<button type="button" class="tree-item" data-view="lan">
					<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tunnel"/></svg>LAN tunnels
				</button>
				<button type="button" class="tree-item" data-view="webhooks">
					<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tunnel"/></svg>Webhooks
				</button>
			</details>
			<details open>
				<summary>Account</summary>
				<button type="button" class="tree-item needs-action" data-view="link">
					<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-link"/></svg><span id="nav-link-label">Connect to Vome</span>
				</button>
				<button type="button" class="tree-item" data-view="switches">
					<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-switch"/></svg>Switches
				</button>
			</details>
			<button type="button" class="tree-item" data-view="about">
				<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-info"/></svg>About
			</button>
		</nav>
	</aside>
	<main>
		<header class="top">
			<h1 id="view-title">Overview</h1>
			<div class="top-actions">
				<button type="button" class="primary" id="header-connect"
					onclick="document.querySelector('[data-view=link]').click()">Connect to Vome</button>
				<button type="button" id="btn-refresh" class="ghost">
					<svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-refresh"/></svg>Refresh
				</button>
			</div>
		</header>
		<p id="banner" class="banner hidden" role="status"></p>
		<section id="view" class="view"></section>
	</main>
	<script src="static/app.js?v=0.3.26"></script>
</body>
</html>
