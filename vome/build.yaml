# Kept for Supervisors that still read build.yaml (pre-BuildKit migration).
# The Dockerfile default FROM is the source of truth for Supervisor 2026.04+.
# Must stay on base-python — a plain Alpine base has no interpreter, and we
# no longer apk-add at build time.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-python:3.13-alpine3.22
  amd64: ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.22
