# https://developers.home-assistant.io/docs/add-ons/configuration
name: Vome
version: "0.3.34"
slug: vome
description: >
  Share virtual switches between Home Assistant homes, connect this instance
  to Vome for remote access without port-forwarding, and manage LAN tunnels
  from a sidebar panel. Bundles the Vome integration (the same code as the
  HACS custom component), so you do not need HACS.
url: https://github.com/Vortitron/VomeSync
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
hassio_api: true
# homeassistant_config = HA's /config (mounted at /homeassistant in here).
# The legacy `config` mapping is deprecated and on newer Supervisors no
# longer grants HA-config access — which silently breaks the integration
# install. Keep the modern mapping only.
map:
  - homeassistant_config:rw
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:home-analytics
panel_title: Vome
options:
  portal_url: "https://vome.io"
schema:
  portal_url: str
# Built from the Dockerfile in this folder (Supervisor local build).
# Do not set `image:` — the Store clones this repo and builds here.
