# https://developers.home-assistant.io/docs/add-ons/configuration
name: Vome
version: "0.3.82"
slug: vome
description: >
  Reach this Home Assistant from anywhere without port-forwarding, see its
  health score, give coding agents such as Claude Code a scoped key, keep a
  standby in sync, and share switches with other homes. Bundles the Vome
  integration, so you do not need HACS.
url: https://github.com/Vortitron/VomeSync
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
hassio_api: true
# Manager, for one thing only (owner, 6 Nov 2026): to update Vome CHAP on an
# install whose Home Assistant is stopped (panel/chap_updater.py). No app can
# update itself, and the Supervisor's own automatic updates go through Home
# Assistant, so a standby's Vome CHAP never updated (GamlaBio.local: 0.2.8 a
# week after 0.2.13). Switches, remote access and the panel need nothing
# beyond the default; CHAP itself, which stops and starts Core and makes
# backups, stays the separate Vome CHAP add-on.
hassio_role: manager
# homeassistant_config = HA's /config (mounted at /homeassistant in here).
# The legacy `config` mapping is deprecated and on newer Supervisors no
# longer grants HA-config access — which silently breaks the integration
# install. Keep the modern mapping only.
map:
  - homeassistant_config:rw
# Lists Vome on Home Assistant's "Model Context Protocol" integration page,
# next to ESPHome Device Builder (panel/mcp_server.py). Read-only tools.
discovery:
  - mcp
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:home-analytics
panel_title: Vome
# The Chat page's OpenRouter key (panel/chat.py). Backups go to cloud
# storage; a key that spends money stays out of them.
backup_exclude:
  - chat.json
options:
  portal_url: "https://vome.io"
schema:
  portal_url: str
# Built from the Dockerfile in this folder (Supervisor local build).
# Do not set `image:` — the Store clones this repo and builds here.
