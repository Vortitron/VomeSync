# https://developers.home-assistant.io/docs/add-ons/configuration
name: Vome
version: "0.3.60"
slug: vome
description: >
  Reach this Home Assistant from anywhere without port-forwarding, see its
  health score, give coding agents such as Claude Code a scoped key, keep a
  standby in sync, and share switches with other homes. Bundles the Vome
  integration, so you do not need HACS.
url: https://github.com/Vortitron/VomeSync
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
hassio_api: true
# No hassio_role: switches, remote access and the panel need nothing beyond
# the default. CHAP, which stops and starts Core and makes backups, is the
# separate Vome CHAP add-on, so only CHAP users grant that.
# homeassistant_config = HA's /config (mounted at /homeassistant in here).
# The legacy `config` mapping is deprecated and on newer Supervisors no
# longer grants HA-config access — which silently breaks the integration
# install. Keep the modern mapping only.
map:
  - homeassistant_config:rw
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:home-analytics
panel_title: Vome
options:
  portal_url: "https://vome.io"
schema:
  portal_url: str
# Built from the Dockerfile in this folder (Supervisor local build).
# Do not set `image:` — the Store clones this repo and builds here.
