# VomeSync Nginx Proxy Configuration

upstream vomesync_api {
	server vomesync-webserver:3090;
}

upstream vomesync_ws {
	server vomesync-webserver:3001;
}

upstream vomesync_website {
	server vomesync-website:80;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# API Server (sync.vome.io)
server {
	listen 80;
	server_name sync.vome.io api.vome.io;
	
	# Security headers
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;
	add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
	
	# API endpoints
	location /api/ {
		limit_req zone=api burst=20 nodelay;
		
		proxy_pass http://vomesync_api;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
		
		# Timeouts
		proxy_connect_timeout 30s;
		proxy_send_timeout 30s;
		proxy_read_timeout 30s;
	}
	
	# WebSocket endpoint
	location /ws {
		proxy_pass http://vomesync_ws;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# WebSocket timeouts
		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 300s;
	}
	
	# Health check
	location /health {
		proxy_pass http://vomesync_api/api/health;
		access_log off;
	}
	
	# Root redirect
	location = / {
		return 301 https://remoteswitch.vome.io;
	}
}

# Website (remoteswitch.vome.io)
server {
	listen 80;
	server_name remoteswitch.vome.io;
	
	# Security headers
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;
	
	location / {
		limit_req zone=general burst=50 nodelay;
		
		proxy_pass http://vomesync_website;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# Static file caching
		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
			expires 1y;
			add_header Cache-Control "public, immutable";
		}
	}
}

