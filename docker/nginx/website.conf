# VomeSync Website Nginx Configuration

server {
	listen 80;
	server_name localhost sync.vome.io;
	root /usr/share/nginx/html;
	index index.html;
	
	# Security headers
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https: ws: wss:; img-src 'self' http: https: data:;" always;
	
	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/json
		application/javascript
		application/xml+rss
		application/atom+xml
		image/svg+xml;
	
	# Main site
	location / {
		try_files $uri $uri/ /index.html;
		
		# Cache control for HTML
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
	}
	
	# Static assets caching
	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header Vary "Accept-Encoding";
	}
	
	# Favicon
	location = /favicon.ico {
		log_not_found off;
		access_log off;
		expires 1y;
	}
	
	# Robots.txt
	location = /robots.txt {
		log_not_found off;
		access_log off;
		add_header Content-Type text/plain;
		return 200 "# AI agents: https://vome.io/llms.txt and /.well-known/agent.gopher\nUser-agent: *\nAllow: /\nSitemap: https://sync.vome.io/sitemap.xml\n";
	}
	
	# Health check
	location /health {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "OK";
	}
	
	# Agent discovery (Gopher over HTTPS, see vome.io/.well-known/agent.gopher).
	# Must be matched before the hidden-file deny below — /.well-known/ starts
	# with a dot but is a deliberate, public path (RFC 8615).
	location = /.well-known/agent.gopher {
		default_type "application/gopher; charset=utf-8";
		add_header Cache-Control "public, max-age=600";
	}
	
	# Security: deny access to hidden files
	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}
}
