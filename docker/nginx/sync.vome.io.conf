# Nginx configuration for sync.vome.io (VomeSync production deployment)
# This configuration should be placed in your main nginx sites-available/sites-enabled directory
# and SSL certificates should be obtained via certbot

server {
	listen 80;
	listen [::]:80;
	server_name sync.vome.io;
	
	# Redirect to HTTPS
	return 301 https://$server_name$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name sync.vome.io;
	
	# SSL configuration (managed by certbot)
	# Run: certbot --nginx -d sync.vome.io
	ssl_certificate /etc/letsencrypt/live/sync.vome.io/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/sync.vome.io/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	
	# Security headers
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	
	# Website (static files served by vomesync-website container)
	location / {
		proxy_pass http://localhost:8111;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# Cache static assets
		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
			proxy_pass http://localhost:8111;
			expires 1y;
			add_header Cache-Control "public, immutable";
		}
	}
	
	# WebSocket endpoint
	location /ws {
		proxy_pass http://localhost:3090;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# WebSocket timeout settings
		proxy_read_timeout 86400;
		proxy_send_timeout 86400;
	}
	
	# API endpoints
	location /api/ {
		proxy_pass http://localhost:3090;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# Rate limiting (optional, configure in nginx http context)
		# limit_req zone=api burst=20 nodelay;
	}
	
	# Health check endpoint
	location /health {
		proxy_pass http://localhost:3090/api/health;
		access_log off;
	}
}

