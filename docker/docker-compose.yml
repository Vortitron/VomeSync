# Docker's json-file driver keeps every byte forever unless told otherwise, and
# there is no /etc/docker/daemon.json on this host setting a global cap. That
# was harmless only while the webserver logged nothing at all (see the redaction
# fix in src/utils/logger.js); with logging restored — at LOG_LEVEL=debug on
# live — an uncapped log on a disk sitting at 88% is a slow outage waiting to
# happen. 50 MB per service, rotated.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  vomesync-redis:
    image: redis:7-alpine
    container_name: vomesync-redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --appendonly yes;
      fi'
    volumes:
      - redis_data:/data
    networks:
      - vomesync_network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      # If a password is set, `redis-cli ping` will fail with NOAUTH. Try AUTH ping first,
      # and fall back to unauthenticated ping for dev/empty-password cases.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG || redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3

  vomesync-webserver:
    build:
      context: ../webserver
      dockerfile: Dockerfile
    container_name: vomesync-webserver
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      vomesync-redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3090
      - WS_PORT=3001
      - REDIS_HOST=vomesync-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://sync.vome.io}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-}
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Relay (outbound-tunnel HA): shared secret authenticating portal<->backend,
      # the portal endpoint that resolves a component's relay secret, and the
      # per-RPC reply timeout. Empty secret fails closed (relay disabled).
      - RELAY_INTERNAL_SECRET=${RELAY_INTERNAL_SECRET:-}
      - RELAY_PORTAL_VERIFY_URL=${RELAY_PORTAL_VERIFY_URL:-https://vome.io/api/internal/relay/verify}
      - RELAY_RPC_TIMEOUT_MS=${RELAY_RPC_TIMEOUT_MS:-20000}
      # HS256 secret for forwarding + LAN-TCP tunnel tokens. Must match the value
      # the portal uses to sign `ha-forward` cookies; also signs/verifies the
      # `lan-tcp` tunnel tokens minted for mint_lan_tcp_token. Empty = disabled.
      - RELAY_FORWARD_SECRET=${RELAY_FORWARD_SECRET:-}
      # Full-UI forwarding proxy (friendly-domain remote login). When set (and
      # RELAY_FORWARD_SECRET is present) the backend runs a browser-forward
      # proxy on this port; the host nginx *.home.vome.io map routes friendly
      # domains to it. Published on loopback only — reached via nginx, never
      # the public internet.
      - FORWARD_PORT=${FORWARD_PORT:-8099}
    ports:
      - "${VOMESYNC_API_HOST_PORT:-3090}:3090"
      - "${VOMESYNC_WS_HOST_PORT:-3001}:3001"
      - "127.0.0.1:${VOMESYNC_FORWARD_HOST_PORT:-8099}:8099"
    volumes:
      - webserver_logs:/usr/src/app/logs
      - webserver_media:/usr/src/app/media
      - ${SSL_CERT_PATH:-/dev/null}:${SSL_CERT_PATH:-/dev/null}:ro
      - ${SSL_KEY_PATH:-/dev/null}:${SSL_KEY_PATH:-/dev/null}:ro
    networks:
      - vomesync_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3090/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vomesync-website:
    image: nginx:alpine
    container_name: vomesync-website
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ../website:/usr/share/nginx/html:ro
      - ./nginx/website.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${VOMESYNC_WEBSITE_HOST_PORT:-8111}:80"
    networks:
      - vomesync_network
    environment:
      - NGINX_HOST=${WEBSITE_DOMAIN:-sync.vome.io}
      - NGINX_PORT=80
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first
      # but nginx in this image binds IPv4 0.0.0.0:80 only, so the check always
      # refused while the published port worked (2 months of false "unhealthy").
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  vomesync-redis-dev:
    image: redis:7-alpine
    container_name: vomesync-redis-dev
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - ../.redisdata:/data
    networks:
      - vomesync_network
    ports:
      - "127.0.0.1:${VOMESYNC_REDIS_DEV_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  vomesync-webserver-dev:
    build:
      context: ../webserver
      dockerfile: Dockerfile
    container_name: vomesync-webserver-dev
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      vomesync-redis-dev:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3091
      - WS_PORT=3002
      - REDIS_HOST=vomesync-redis-dev
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=dev-secret-change-in-production
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CORS_ORIGINS=http://localhost:8112,http://localhost:8123
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - ENABLE_ANALYTICS=false
      - LOG_LEVEL=debug
      - HCAPTCHA_SECRET=
      - HCAPTCHA_BYPASS_TOKEN=test-bypass-token
      - RELAY_INTERNAL_SECRET=${RELAY_INTERNAL_SECRET:-}
      - RELAY_PORTAL_VERIFY_URL=${RELAY_PORTAL_VERIFY_URL:-https://vome.io/api/internal/relay/verify}
      - RELAY_RPC_TIMEOUT_MS=${RELAY_RPC_TIMEOUT_MS:-20000}
      - RELAY_FORWARD_SECRET=${RELAY_FORWARD_SECRET:-dev-forward-secret-change-in-production}
    ports:
      - "${VOMESYNC_API_DEV_HOST_PORT:-3091}:3091"
      - "${VOMESYNC_WS_DEV_HOST_PORT:-3002}:3002"
    volumes:
      - webserver_media_dev:/usr/src/app/media
    networks:
      - vomesync_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3091/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vomesync-website-dev:
    image: nginx:alpine
    container_name: vomesync-website-dev
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ../website:/usr/share/nginx/html:ro
      - ./nginx/website.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${VOMESYNC_WEBSITE_DEV_HOST_PORT:-8112}:80"
    networks:
      - vomesync_network
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
      - API_URL=http://localhost:3091
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first
      # but nginx in this image binds IPv4 0.0.0.0:80 only, so the check always
      # refused while the published port worked (2 months of false "unhealthy").
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  vomesync-proxy:
    image: nginx:alpine
    container_name: vomesync-proxy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - vomesync-webserver
      - vomesync-website
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH:-/dev/null}:/etc/ssl/certs/vomesync.pem:ro
      - ${SSL_KEY_PATH:-/dev/null}:/etc/ssl/private/vomesync.key:ro
    ports:
      - "${VOMESYNC_PROXY_HTTP_HOST_PORT:-8080}:80"
      - "${VOMESYNC_PROXY_HTTPS_HOST_PORT:-8443}:443"
    networks:
      - vomesync_network
    environment:
      - API_DOMAIN=${API_DOMAIN:-sync.vome.io}
      - WEBSITE_DOMAIN=${WEBSITE_DOMAIN:-sync.vome.io}
      - ENABLE_SSL=${ENABLE_SSL:-false}

volumes:
  redis_data:
    name: ${VOMESYNC_REDIS_VOLUME_NAME:-vomesync_redis_data}
    driver: local
  webserver_logs:
    name: ${VOMESYNC_LOGS_VOLUME_NAME:-vomesync_webserver_logs}
    driver: local
  webserver_media:
    name: ${VOMESYNC_MEDIA_VOLUME_NAME:-vomesync_webserver_media}
    driver: local
  webserver_media_dev:
    name: ${VOMESYNC_MEDIA_DEV_VOLUME_NAME:-vomesync_webserver_media_dev}
    driver: local

networks:
  vomesync_network:
    driver: bridge
