services:
  vomesync-redis:
    image: redis:7-alpine
    container_name: vomesync-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - vomesync_network
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  vomesync-webserver:
    build:
      context: ../webserver
      dockerfile: Dockerfile
    container_name: vomesync-webserver
    restart: unless-stopped
    depends_on:
      vomesync-redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3090
      - WS_PORT=3001
      - REDIS_HOST=vomesync-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://remoteswitch.vome.io}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-}
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "3090:3090"
      - "3001:3001"
    volumes:
      - webserver_logs:/usr/src/app/logs
      - ${SSL_CERT_PATH:-/dev/null}:${SSL_CERT_PATH:-/dev/null}:ro
      - ${SSL_KEY_PATH:-/dev/null}:${SSL_KEY_PATH:-/dev/null}:ro
    networks:
      - vomesync_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3090/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vomesync-website:
    image: nginx:alpine
    container_name: vomesync-website
    restart: unless-stopped
    volumes:
      - ../website:/usr/share/nginx/html:ro
      - ./nginx/website.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8111:80"
    networks:
      - vomesync_network
    environment:
      - NGINX_HOST=${WEBSITE_DOMAIN:-sync.vome.io}
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  vomesync-website-dev:
    image: nginx:alpine
    container_name: vomesync-website-dev
    restart: unless-stopped
    volumes:
      - ../website:/usr/share/nginx/html:ro
      - ./nginx/website.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8112:80"
    networks:
      - vomesync_network
    environment:
      - NGINX_HOST=${WEBSITE_DOMAIN:-sync.vome.io}
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  vomesync-proxy:
    image: nginx:alpine
    container_name: vomesync-proxy
    restart: unless-stopped
    depends_on:
      - vomesync-webserver
      - vomesync-website
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH:-/dev/null}:/etc/ssl/certs/vomesync.pem:ro
      - ${SSL_KEY_PATH:-/dev/null}:/etc/ssl/private/vomesync.key:ro
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - vomesync_network
    environment:
      - API_DOMAIN=${API_DOMAIN:-sync.vome.io}
      - WEBSITE_DOMAIN=${WEBSITE_DOMAIN:-remoteswitch.vome.io}
      - ENABLE_SSL=${ENABLE_SSL:-false}

volumes:
  redis_data:
    driver: local
  webserver_logs:
    driver: local

networks:
  vomesync_network:
    driver: bridge
