name: VomeSync HA tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read

jobs:

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python linting tools
        run: pip install flake8

      - name: Run Python linting
        run: |
          # Home Assistant integration + tests (project uses tabs; ignore tab-indentation warnings)
          flake8 custom_components hacs-addon/tests \
            --max-line-length=100 \
            --ignore=E101,E121,E123,E126,E127,E128,E131,E201,E202,E203,E221,E222,E225,E226,E231,E241,E251,E261,E262,E265,E266,E271,E272,E301,E302,E303,E305,E306,E401,E402,E501,E701,E702,E703,E704,E711,E712,E713,E714,E721,E722,E731,E741,W191,W291,W293,W391,W503

  unit-tests:
    name: HA integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r hacs-addon/tests/requirements.txt

      - name: Run Home Assistant integration tests
        run: pytest hacs-addon/tests/ -v

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          pip install -r hacs-addon/tests/requirements.txt
          pip install pytest-cov

      - name: Run Python tests with coverage
        run: pytest hacs-addon/tests/ --cov=custom_components/vomesync --cov-report=xml

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          flags: hacs-addon
          fail_ci_if_error: false
