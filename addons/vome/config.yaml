# https://developers.home-assistant.io/docs/add-ons/configuration
name: Vome
version: "0.1.0"
slug: vome
description: >
  Installs and keeps the Vome Home Assistant integration up to date, and is the
  home for heavier companions (LAN helpers, future browser RDP). The Python
  integration code is the same tree HACS uses — one codebase, two install paths.
url: https://github.com/Vortitron/VomeSync
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
hassio_api: true
map:
  - config:rw
startup: application
boot: auto
options: {}
schema: {}
image: false
panel_icon: mdi:home-analytics
panel_title: Vome
