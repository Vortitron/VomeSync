configuration:
  local_pair:
    name: Local pair
    description: >-
      Pair this Home Assistant with another one in your house, so one takes
      over when the other stops -- no Vome account needed. "main" on the one
      running your home (it then shows a pairing code), "standby" on the
      other. Leave "off" if you use CHAP through Vome.
  pair_code:
    name: Pairing code
    description: >-
      On the standby only: the code the main install shows (it starts with
      vcp1.). Keep it private.
  install_name:
    name: This install's name
    description: >-
      Optional: what to call this Home Assistant in the pair's notifications
      and on its page ("Kitchen NUC"). Without it, "Main install" or "Standby".
  takeover_after:
    name: Take over after (seconds)
    description: >-
      On the standby: how long the main install must be out of reach, with
      your router answering, before the standby takes over. Shorter is
      quicker; longer rides out a reboot or a blip without moving your home.
      30 to 900; 120 if unset.
  home_address:
    name: Your home's address at home
    description: >-
      On the main install: one address on your house network that always
      reaches whichever Home Assistant runs your home -- point the app and
      your dashboards at it. Pick an unused one outside the range your router
      hands out (e.g. 192.168.1.15). The standby learns it from the main
      install. Both need a fixed address of their own.
network:
  8177/tcp: Local pair (the other Home Assistant in your house)
